<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RajatFiles | {{file_name}}</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #f1f3f5;
            --text-muted: #9aa0a8;
            --accent: #4f8cff;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }
        .container { width: 100%; max-width: 860px; }
        .player-wrap {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        video {
            width: 100%;
            max-height: 70vh;
            display: block;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
        }
        .file-title {
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-word;
            margin-bottom: 6px;
        }
        .file-size {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #23262e;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn:hover { background: #2b2f38; }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover { background: #3d7ae8; }
        .speed-select {
            background: #23262e;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
        }
        .warning {
            margin-top: 14px;
            padding: 10px 12px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 8px;
            font-size: 0.82rem;
            color: #fbbf24;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text);
            text-decoration: none;
        }
        .header-links {
            display: flex;
            gap: 14px;
        }
        .header-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .header-links a:hover { color: var(--accent); }
        @media (max-width: 480px) {
            .actions { flex-direction: column; }
            .btn, .speed-select { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="https://t.me/RajatFiles" class="logo">RajatFiles</a>
            <div class="header-links">
                <a href="https://t.me/RajatFilesGroup">Request Group</a>
                <a href="https://t.me/RFAdvanceBot">Our Bot</a>
            </div>
        </div>
        <div class="player-wrap">
            <video id="player" controls playsinline>
                <source src="{{file_url}}" />
            </video>
        </div>

        <div class="card">
            <div class="file-title" id="fileTitle">{{file_name}}</div>
            <div class="file-size">{{file_size}}</div>

            <div class="actions">
                <button class="btn btn-primary" onclick="downloadFile()">⬇ Download</button>
                <select class="speed-select" onchange="setSpeed(this.value)">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x Normal</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>
                <button class="btn" onclick="vlcPlayer()">VLC Player</button>
                <button class="btn" onclick="mxPlayer()">MX Player</button>
                <button class="btn" onclick="playitPlayer()">PLAYit</button>
                <button class="btn" onclick="kmPlayer()">KMPlayer</button>
            </div>

            <div class="warning" id="audioWarning" style="display:none;">
                ⚠️ Your browser may not support this file's audio track. If there's no sound, try one of the external players above.
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Bharathboy/utils@main/jsmkv-polyfill.js"></script>
    <script>
        const FILE_URL = "{{file_url}}";
        const FILE_NAME = "{{file_name}}";

        function initPlayer() {
            const video = document.querySelector("#player");
            const ext = FILE_URL.split("?")[0].split(".").pop().toLowerCase();
            if (["flv", "ts"].includes(ext) && typeof mpegts !== "undefined") {
                try {
                    const player = mpegts.createPlayer({ type: "flv", url: FILE_URL, isLive: false });
                    player.attachMediaElement(video);
                    player.load();
                } catch (e) {
                    console.error("mpegts init failed:", e);
                }
            }
            // jsmkv-polyfill.js (loaded above) auto-patches .mkv playback support where needed.
        }

        function setSpeed(val) {
            const video = document.querySelector("#player");
            if (video) video.playbackRate = parseFloat(val);
        }

        function downloadFile() {
            const a = document.createElement("a");
            a.href = FILE_URL;
            a.download = FILE_NAME;
            a.click();
        }

        function vlcPlayer() {
            const stripped = FILE_URL.replace(/^https?:\/\//, "");
            window.location.href = `vlc://${stripped}`;
            setTimeout(() => {
                window.location.href = `intent:${FILE_URL}#Intent;action=android.intent.action.VIEW;type=video/*;package=org.videolan.vlc;end`;
            }, 500);
        }

        function mxPlayer() {
            window.location.href = `intent:${FILE_URL}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;end`;
        }

        function playitPlayer() {
            window.location.href = `playit://playerv2/video?url=${FILE_URL}`;
        }

        function kmPlayer() {
            window.location.href = `intent:${FILE_URL}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.kmplayer;end`;
        }

        function checkAudioSupport() {
            const video = document.createElement("video");
            if (video.canPlayType('audio/mp4; codecs="ec-3"') === "") {
                const warning = document.getElementById("audioWarning");
                if (warning) warning.style.display = "block";
            }
        }

        function cleanFileName() {
            const el = document.getElementById("fileTitle");
            if (el) {
                el.textContent = el.textContent
                    .replace(/[._]/g, " ")
                    .replace(/\[|\]|\{|\}/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }
        }

        cleanFileName();
        initPlayer();
        checkAudioSupport();
    </script>
</body>
</html>
