<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{file_name}}</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #1a1d24;
            --text: #f1f3f5;
            --text-muted: #9aa0a8;
            --accent: #4f8cff;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .icon {
            font-size: 2.5rem;
            margin-bottom: 14px;
        }
        .file-title {
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-word;
            margin-bottom: 6px;
        }
        .file-size {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 22px;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary:hover { background: #3d7ae8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📄</div>
        <div class="file-title" id="fileTitle">{{file_name}}</div>
        <div class="file-size">{{file_size}}</div>
        <button class="btn-primary" onclick="downloadFile()">⬇ Download File</button>
    </div>

    <script>
        const FILE_URL = "{{file_url}}";
        const FILE_NAME = "{{file_name}}";

        function downloadFile() {
            const a = document.createElement("a");
            a.href = FILE_URL;
            a.download = FILE_NAME;
            a.click();
        }

        function cleanFileName() {
            const el = document.getElementById("fileTitle");
            if (el) {
                el.textContent = el.textContent
                    .replace(/[._]/g, " ")
                    .replace(/\[|\]|\{|\}/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
            }
        }

        cleanFileName();
    </script>
</body>
</html>
